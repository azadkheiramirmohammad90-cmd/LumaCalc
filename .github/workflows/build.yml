
name: Build LumaCalc APK - retry

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake
          python -m pip install --upgrade pip
          pip install "Cython<3" "buildozer==1.5.0"

      - name: Restore signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/lumacalc-release.jks"
          chmod 600 "$RUNNER_TEMP/lumacalc-release.jks"
      - name: Verify signing key
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/lumacalc-release.jks" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS"
      - name: Build signed APK
        env:
          PIP_VERSION: "23.3.2"
          PIP_NO_BUILD_ISOLATION: "false"
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/lumacalc-release.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: yes | buildozer -v android release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaCalc-APK
          path: bin/*.apk
          if-no-files-found: error
          
